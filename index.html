<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scroll Grow Sequence</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: white;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      opacity: 0;
    }

    body.start {
      animation: pageFadeIn 2s ease-out forwards;
    }

    @keyframes pageFadeIn {
      to {
        opacity: 1;
      }
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @font-face {
      font-family: 'MyCustomFont';
      src: url('calgaryscriptot.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    .title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgb(27, 27, 27);
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
      font-size: 11vw;
      font-family: 'MyCustomFont';
    }

    .viewer img {
      position: absolute;
      z-index: 1;
      width: 1vw;
      max-width: 500vw;
      transform: scale(0.01);
      opacity: 0;
      object-fit: cover;
    }

    #scrollSpace {
      width: 100%;
    }

    @media (max-width: 900px) {
      .title {
        font-size: 17vw;
      }

      .viewer img {
        width: 62vw;
      }
    }
  </style>
</head>

<body>

  <div class="viewer">
    <div id="title" class="title"></div>
    <img id="image" src="" />
  </div>

  <div id="scrollSpace"></div>

  <script>
    window.addEventListener("load", async () => {

      setTimeout(() => {
        document.body.classList.add("start");
      }, 500);

      window.scrollTo(0, 0);

      // =========================================================
      // PEOPLE
      // =========================================================

      const people = [
        "David",
        "Anna",
        "Mafalda",
        "Nazar",
        "TaeYoung",
        "Naeun",
        "Jiwon",
        "Sonya",
        "Carina",
        "Electra",
        "Bink",
        "Sjoerd",
        "Amelia",
        "Yeva",
        "Yordana",
        "Laura",
        "Alara",
        "Timea"
      ];

      // Shuffle people
      shuffleArray(people);

      // =========================================================
      // DOM
      // =========================================================

      const title = document.getElementById("title");
      const image = document.getElementById("image");
      const scrollSpace = document.getElementById("scrollSpace");

      // =========================================================
      // SETTINGS
      // =========================================================

      const growDistance = 5000;

      // =========================================================
      // AUTO DETECT IMAGES
      // =========================================================

      /*
        IMPORTANT:

        Your files should be named like:

        david1.webp
        david2.webp
        david3.webp
        ...

        anna1.webp
        anna2.webp
        ...

        The code automatically checks until
        it no longer finds a file.
      */

      async function imageExists(src) {
        return new Promise((resolve) => {
          const img = new Image();

          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);

          img.src = src;
        });
      }

      async function getImagesForPerson(name) {
        const files = [];
        let index = 1;

        while (true) {
          const fileName =
            name.toLowerCase() + index + ".webp";

          const exists = await imageExists(fileName);

          if (!exists) break;

          files.push(fileName);
          index++;
        }

        return files;
      }

      // =========================================================
      // BUILD SEQUENCE
      // =========================================================

      /*
        Each stage becomes:

        {
          type: "title"
        }

        OR

        {
          type: "image",
          src: "david1.webp"
        }
      */

      const stages = [];

      for (const person of people) {

        // Title stage
        stages.push({
          type: "title",
          name: person
        });

        // All image stages
        const images = await getImagesForPerson(person);

        images.forEach(src => {
          stages.push({
            type: "image",
            name: person,
            src
          });
        });
      }

      // =========================================================
      // PAGE HEIGHT
      // =========================================================

      scrollSpace.style.height =
        (stages.length * growDistance + window.innerHeight) + "px";

      // =========================================================
      // HELPERS
      // =========================================================

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function easeInOutCubic(t) {
        return t < 0.5
          ? 4 * t * t * t
          : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      // =========================================================
      // UPDATE
      // =========================================================

      let currentImage = "";

      function update() {

        const scroll = window.scrollY;

        const stageIndex = Math.floor(scroll / growDistance);

        const safeStage =
          Math.min(stageIndex, stages.length - 1);

        const currentStage = stages[safeStage];

        const stageStart = safeStage * growDistance;

        const progress = clamp(
          (scroll - stageStart) / growDistance,
          0,
          1
        );

        let eased = easeInOutCubic(progress);

        // Extra acceleration
        if (progress > 0.7) {
          const boost = (progress - 0.7) / 0.3;
          eased += boost * 1.2;
        }

        // =====================================================
        // TITLE STAGE
        // =====================================================

        if (currentStage.type === "title") {

          title.style.display = "flex";
          title.textContent = currentStage.name;

          const baseSize = window.innerWidth * 0.006;
          const maxSize = baseSize * 400;

          const size =
            baseSize +
            (maxSize - baseSize) * eased;

          title.style.fontSize = size + "px";

          let opacity = 1;

          if (progress >= 0.98) {
            opacity = 0;
          }

          title.style.opacity = opacity;

          image.style.opacity = 0;

          return;
        }

        // =====================================================
        // IMAGE STAGE
        // =====================================================

        title.style.display = "none";

        if (currentStage.src !== currentImage) {
          currentImage = currentStage.src;
          image.src = currentStage.src;
        }

        const scale = 1 + eased * 100;

        let opacity = 1;

        if (progress < 0.08) {
          opacity = progress / 0.08;
        }

        if (progress >= 0.98) {
          opacity = 0;
        }

        image.style.opacity = clamp(opacity, 0, 1);

        image.style.transform =
          `scale(${scale})`;
      }

      // =========================================================
      // EVENTS
      // =========================================================

      window.addEventListener("scroll", update);

      update();
    });
  </script>

</body>
</html>
